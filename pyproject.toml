[project]
name = "football-dbt-duckdb"
version = "0.1.0"
description = "A local pipeline for football data built with dbt + DuckDB, with SkillCorner open data as its first source."
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    # Below 2: DuckDB 2 writes a file format that 1.x command-line clients can't open.
    "duckdb>=1.1,<2",
    "requests>=2.31",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
