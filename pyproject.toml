[project]
name = "football-dbt-duckdb"
version = "0.1.0"
description = "A free, laptop-sized football data stack: dbt + DuckDB on SkillCorner open data. Learn analytics engineering, or test dbt models locally before they reach a warehouse."
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    "duckdb>=1.1",
    "requests>=2.31",
]

[tool.uv]
package = false
