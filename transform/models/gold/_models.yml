version: 2

models:
  - name: gold_player_match_metrics
    description: >
      One row per player per match. Counts plus rates normalised by the
      correct clock (per 30 min in possession / out of possession).
      This is the table an analyst or a dashboard reads.
    columns:
      - name: player_match_id
        data_tests: [not_null, unique]
      - name: player_name
        data_tests: [not_null]
      - name: minutes_tip
        data_tests: [not_null]
      - name: off_ball_runs
        data_tests: [not_null]

  - name: gold_team_match_summary
    description: One row per team per match.
    columns:
      - name: team_match_id
        data_tests: [not_null, unique]
      - name: team_name
        data_tests: [not_null]

  - name: gold_team_season_summary
    description: >
      One row per team across every match it appears in. Teams appear a
      different number of times in the sample, so matches_in_sample is part
      of the table.
    columns:
      - name: team_id
        data_tests: [not_null, unique]
      - name: team_name
        data_tests: [not_null]
      - name: matches_in_sample
        data_tests: [not_null]
      - name: minutes_tip
        data_tests: [not_null]
