name: football_dbt_duckdb
version: "1.0"
profile: football_dbt_duckdb

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  football_dbt_duckdb:
    # Everything is a table, staging included: a view over read_csv/read_json
    # keeps a path relative to transform/, so it breaks when the database is
    # opened from anywhere else (the notebook, `make query`).
    +materialized: table
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
